<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var wantsDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (wantsDark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <title>{% block title %}Домашние задания{% endblock %}</title>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="{{ '/' if authed else '/login' }}"><h1>Домашние задания</h1></a>
      <nav class="top-nav">
        {% if authed %}
          <a href="/" class="{{ 'active' if active_page == 'dashboard' }}">Задания</a>
          <a href="/students" class="{{ 'active' if active_page == 'students' }}">Студенты</a>
        {% endif %}
        <button id="theme-toggle" class="theme-toggle" type="button" title="Тёмная/светлая тема" aria-label="Переключить тему">
          <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
        </button>
        {% if authed %}<a class="logout" href="/logout">Выйти</a>{% endif %}
      </nav>
    </header>

    {% block content %}{% endblock %}
  </div>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          try { localStorage.setItem('theme', 'light'); } catch (e) {}
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          try { localStorage.setItem('theme', 'dark'); } catch (e) {}
        }
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
