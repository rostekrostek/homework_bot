{% extends "base.html" %}
{% block title %}Вход — Домашние задания{% endblock %}
{% block content %}
  <div class="login-box">
    <h2>Вход в панель</h2>
    <p style="color: var(--muted); margin-top: -8px;">Панель преподавателя</p>
    <form method="post" action="/login">
      <div class="field-label">Пароль</div>
      <input type="password" name="password" autofocus required>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <button type="submit">Войти</button>
    </form>
  </div>
{% endblock %}
